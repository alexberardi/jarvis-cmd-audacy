# Per-package mpd config for jarvis-cmd-audacy.
#
# Read by mpd via the MPDCONF env var set in its systemd drop-in
# (configure_systemd_service post_install op). This bypasses the
# system /etc/mpd.conf entirely — which is the whole point:
#
#   - /etc/mpd.conf has `user "mpd"` which fights any User= override.
#   - /var/lib/mpd, /var/log/mpd, /run/mpd are owned by user `mpd`
#     and would need a privileged chown to be writable by the node user.
#
# By pointing mpd at this file instead, the daemon runs as the node user
# with no /etc edits, no chowns, and no fights with the Debian package.
#
# Path on the node:
#   /home/<node-user>/.jarvis/packages/audacy/audacy_lib/audacy_shared/audacy_mpd.conf
# The systemd drop-in resolves the user's home via systemd's %h specifier:
#   Environment="MPDCONF=%h/.jarvis/packages/audacy/audacy_lib/audacy_shared/audacy_mpd.conf"

# Bind to loopback only — mpd is a private playback backend for the audacy
# command, not a shared music server. The mpd_client in audacy_shared/
# always connects to localhost:6600.
bind_to_address "localhost"
port "6600"

# No music library, no playlists, no persistent state — Audacy only plays
# live HTTP/HLS stream URLs. We intentionally omit:
#   music_directory     — no local files
#   playlist_directory  — no stored playlists
#   db_file             — no database
#   state_file          — no state to restore (live radio, not paused tracks)
#   pid_file            — systemd manages the process; no pidfile needed
#   log_file            — mpd logs to journal via stderr by default
#
# Omitting these is supported as of mpd 0.21+ — the daemon runs as a
# pure stream player with no on-disk state.

# Audio routes through PulseAudio so it shares the node user's session
# (the same one TTS / shairport-sync / spotifyd use). Net effect: audio
# follows any paired Bluetooth speaker, mirroring how Jarvis's voice does.
audio_output {
    type "pulse"
    name "Audacy"
}
