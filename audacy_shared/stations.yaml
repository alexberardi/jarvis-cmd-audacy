# Audacy station catalog. Each entry maps to a live stream that the
# stream_resolver builds an AmperWave URL for, with a StreamTheWorld
# fallback. Aliases drive fuzzy lookup against the voice query.
#
# Fields:
#   callsign       — official station call letters (used to derive URLs)
#   band           — "am" or "fm" (used to build the AmperWave slug)
#   display_name   — what we speak back to the user
#   aliases        — phrases the user might say; case-insensitive substring match
#   format         — content category: sports | news | rock | pop | country | talk | alt
#   market         — city/region (for future per-market preferences)
#   stream_url     — optional override; if set, the resolver uses it verbatim
#                    instead of constructing AmperWave/StreamTheWorld URLs

stations:
  # --- Sports ---
  - callsign: WFAN
    band: am
    display_name: Sports Radio 66 WFAN
    aliases: ["wfan", "the fan", "sports radio 66", "660 wfan", "sixty six"]
    format: sports
    market: New York

